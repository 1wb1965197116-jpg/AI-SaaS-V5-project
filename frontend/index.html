<!DOCTYPE html>
<html>
<head>
  <title>AI SaaS V5 Dashboard</title>
</head>
<body>

<h2>AI Browser Assistant</h2>

<textarea id="prompt" placeholder="Enter text or URL"></textarea>

<select id="lang">
  <option value="English">English</option>
  <option value="Spanish">Spanish</option>
  <option value="French">French</option>
</select>

<button onclick="translate()">Translate</button>

<pre id="out"></pre>

<script>
async function translate(){
  const prompt = document.getElementById('prompt').value;
  const lang = document.getElementById('lang').value;

  const res = await fetch('/api/ai', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ prompt, targetLang: lang })
  });

  const data = await res.json();
  document.getElementById('out').innerText = data.translation;
}
</script>

</body>
</html>
